# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Krishnendu"
title_separator          : "-"
name                     : &name "N. V. Krishnendu"
description              : &description "Krishnendu's academic profile"
url                      : "https://krishnendugit.github.io"
baseurl                  : "/nv-krishnendu"
repository               : "KrishnenduGit/nv-krishnendu"

# Site Author
author:
  avatar           : "profile.png"
  name             : "N. V. Krishnendu"
  pronouns         :
